# Original weights, deployment configuration and runner remain untouched.
base_config: /root/LeTools-Learning/configs/deploy/deploy_scene1.yaml
project_root: /root/LeTools-Learning
max_steps: 2200
sensor_timeout_s: 2.0
startup_timeout_s: 15.0
log_every_steps: 1
snapshot_every_steps: 20
motion:
  direct_to_wbc: false  # retain original ACT arm-control route
  head_init_degrees: [0.0, 20.0]  # explicit SDK compatibility fix; null preserves original
  smoothing_alpha: 1.0
  max_joint_velocity_rad_s: 1.5
head_camera:
  enabled: true
  home_degrees: [0, 20]
  limits_degrees: [70, 25]
  speed_degrees_s: [35, 20]
  home_tolerance_degrees: 2.6
  stable_frames: 3
vision:
  table_segmentation: true
  table_hsv: [[40, 120, 20], [85, 255, 255]]
  image_key: observation.images.head_cam_h
  roi: [0.05, 0.18, 0.95, 0.95]  # table region observed in scene1 head camera
  min_area_fraction: 0.0003
  max_area_fraction: 0.08
  min_fill_ratio: 0.35
  min_solidity: 0.65
  max_aspect_ratio: 3.5
  stable_frames: 3
  max_center_jump_px: 45.0
  include_bright_labels: true
  label_max_saturation: 50
  label_min_value: 120
  min_color_fraction: 0.08
  targets:
    brown: [[12, 15, 75], [40, 100, 255]]
    yellow: [[18, 75, 70], [40, 255, 255]]
    orange: [[3, 100, 65], [20, 255, 255]]
    blue: [[90, 10, 60], [130, 255, 255]]
grasp:
  closed_threshold: 0.75
  open_threshold: 0.2
  missing_frames: 5
  feedback_grace_frames: 10
  # Measure these normalized ROIs in successful wrist-camera grasp images.
  # null: no visual grasp/drop verdict; candidates and feedback still logged.
  left_roi: null
  right_roi: null
cartesian_alignment:
  enabled: true
  strategy: act_residual  # legacy staged paths are not used
  base_frame: base_link
  camera_frame: Head Camera View
  camera_mount_frame: camera_base
  description_param: /humanoid_description
  head_joint_indices: [-2, -1]  # SDK uses the last two joints for yaw/pitch
  fixed_ik_waist: true  # arm-only FK/IK model fixes the non-arm waist joint
  rgb_topic: /cam_h/color/image_raw/compressed
  depth_topic: /cam_h/depth/image_raw/compressedDepth
  info_topic: /cam_h/color/camera_info
  image_wh: [848, 480]
  max_sensor_age_s: 1.0
  max_rgb_depth_dt_s: 0.1
  max_rgb_joint_dt_s: 0.035
  workspace_min: [0.10, -0.80, -0.40]
  workspace_max: [1.20, 0.80, 0.30]
  table_hsv: [[40, 100, 15], [85, 255, 255]]
  min_object_height_m: 0.025
  max_object_height_m: 0.14
  grid_resolution_m: 0.0075
  min_component_points: 30
  max_object_extent_m: 0.19
  max_object_width_m: 0.065  # reject gripper/parcel merged depth components
  close_threshold: 0.6
  open_threshold: 0.25
  other_arm_closed_threshold: 0.55
  skip_initial_grasps: 0
  max_target_distance_m: 0.12
  max_xy_correction_m: 0.10
  max_joint_residual_rad: 0.50
  alignment_tolerance_m: 0.012
  alignment_timeout_steps: 50  # per waypoint, with measured convergence checks
  loaded_alignment_timeout_steps: 90  # allow static load calibration to settle
  clearance_m: 0.07
  alignment_z_tolerance_m: 0.015
  orientation_tolerance_rad: 0.15
  stable_steps: 3
  settle_motion_m: 0.003
  close_dwell_steps: 6
  release_dwell_steps: 8
  release_tolerance_m: 0.020
  closed_command: 0.98
  approach_joint_velocity_rad_s: 0.6
  transport_offset_decay: 0.8
  lift_before_offset_decay_m: 0.06
  target_memory_steps: 40  # retain stable pre-occlusion detections during approach
  target_stable_frames: 3
  target_association_distance_m: 0.025
  placement_margin_m: 0.025  # cover tracking tolerance, depth bias and footprint underestimation
  weighing_release_height_m: 0.08  # pinch above observed table, never a world coordinate
  max_weighing_release_height_m: 0.16  # fallback only at the lowest reachable stable pose
  placement_vertical_step_m: 0.035
  tracking_compensation_gain: 2.0
  tracking_compensation_alpha: 0.1
  max_tracking_compensation_rad: 0.20
  max_loaded_tracking_compensation_rad: 1.20  # calibrated offset; physical URDF limits still apply
  max_loaded_feedforward_rad: 1.20
  loaded_tracking_compensation_gain: 1.0
  loaded_tracking_compensation_alpha: 0.08
  side_grasp_insertion_m: 0.02
# Optional local visual servo: requires measured calibration and an explicit
# target, reference pixel, camera and ACT gripper window. Disabled initially.
servo:
  enabled: false
  arm: left
  image_key: observation.images.wrist_cam_l
  target: yellow
  desired_uv: null
  calibration_file: null
  gain: 0.3
  max_joint_offset_rad: 0.03
  max_error_px: 60.0
  deadband_px: 3.0
  gripper_window: [0.0, 0.15]

visual_residual:
  close_event_threshold: 0.25
  max_translation_m: 0.020
  max_joint_offset_rad: 0.2617993878  # 15 degrees per arm joint; physical URDF limits also enforced
  max_placement_joint_offset_rad: 0.5235987756  # 30 degrees only while leveling over the pad
  max_joint_step_rad: 0.012
  gain: 0.25
  grasp_tolerance_m: 0.012
  grasp_z_tolerance_m: 0.010
  placement_tolerance_m: 0.015
  placement_margin_m: 0.025
  max_release_error_m: 0.080  # guard on observed parcel distance from the pad center
  max_release_gap_m: 0.002  # observed lowest edge is within 2 mm of the pad before opening
  level_target_degrees: 10.0
  level_target_bottom_spread_m: 0.023
  level_tolerance_degrees: 15.0
  max_bottom_height_spread_m: 0.034
  placement_heading_settle_degrees: 10.0
  placement_heading_tolerance_degrees: 15.0
  max_grasp_steps: 45
  max_initial_pregrasp_steps: 160  # allow a settled dwell after initial XY alignment
  max_close_settle_steps: 40
  max_release_steps: 450

wrist_assist:
  enabled: true
  act_after_regrasp: true  # keep visual first pickup/weighing/regrasp; ACT takes over for handover/bin
  handover_grip_guard: true  # hold right until left has stable blocked-finger contact
  handover_contact_frames: 3
  trace_act_handover: true  # compare fresh chunks with the temporally ensembled command
  refresh_stale_handover_ensemble: true  # once, on persistent fresh-close/ensemble-open conflict
  max_regrasp_joint_offset_rad: 0.5235987756  # 30 degrees, authorized for empty-hand regrasp
  regrasp_pitch_degrees: 12.5
  regrasp_finger_tilt_degrees: 5.0
  regrasp_descent_request_m: 0.012  # bounded request per correction, goal remains parcel mid-height
  require_edges: true
  use_parcel_outline: true
  centering_deadband_px: 4
  regrasp_aligned_error_px: 10
  min_edge_support: 0.64
  min_area_px: 600
  max_bbox_px: 320
  max_center_error_px: 25
  max_regrasp_center_error_px: 45
  aligned_error_px: 22
  max_correction_m: 0.012
  stable_frames: 3
  max_pregrasp_align_steps: 320
  max_level_regrasp_steps: 900  # level, stand off, lower, and insert share this budget
  regrasp_visible_v_fraction: 0.67  # move the parcel top above the open-finger occlusion band
  release_open_dwell_steps: 12
  release_short_retreat_m: 0.050  # open hand: provide room for the subsequent leveling sweep
  release_clearance_rise_m: 0.020
  release_retreat_ready_m: 0.014
  max_short_retreat_steps: 140
  max_open_joint_delta_rad: 0.025
  max_handover_align_steps: 80
